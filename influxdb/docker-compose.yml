# =====================================================================
#  InfluxDB v2 - Smart Agriculture
#  Jalankan:  docker compose up -d
#  UI:        http://localhost:8086
# =====================================================================
services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb-smart-agri
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # Inisialisasi otomatis saat pertama kali jalan
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: smart-agri
      DOCKER_INFLUXDB_INIT_BUCKET: agriculture
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      # Token tetap agar cocok dengan config.h contoh
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: smart-agri-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

volumes:
  influxdb-data:
  influxdb-config:
